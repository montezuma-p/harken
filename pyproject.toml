[project]
name = "hark"
version = "0.1.0"
description = "Local, offline audio transcription CLI (faster-whisper) with WhatsApp chat-export support"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pedro Montezuma", email = "pedromontezuma8@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["faster-whisper>=1.0"]
keywords = [
    "transcription",
    "whisper",
    "faster-whisper",
    "speech-to-text",
    "offline",
    "whatsapp",
    "claude-code",
    "agent-skills",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://github.com/montezuma-p/hark"
Issues = "https://github.com/montezuma-p/hark/issues"

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
hark = "hark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
