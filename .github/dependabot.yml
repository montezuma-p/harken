version: 2

updates:
  # Actions are pinned by commit SHA in ci.yml, which is secure but freezes them
  # until something bumps them. This is that something. Dependabot reads the
  # `# v6`-style comment next to each SHA to know what version it stands for.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # One PR for all of them: a pull request now builds the full 5-target
    # release matrix (pr-run-mode = "upload"), so each extra PR costs a real
    # matrix run.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    # CAVEAT: this ecosystem scans every file in .github/workflows, and there is
    # no way to limit it to one. release.yml is GENERATED by `dist generate` and
    # is not SHA-pinned, so Dependabot may propose edits there too. Do not merge
    # those — a later `dist generate` would silently revert them. The right fix
    # for release.yml is to bump `cargo-dist-version` in dist-workspace.toml and
    # regenerate.

  # Cargo is here mostly for security freshness; `cargo audit` in the deps job
  # only reports known advisories, it does not notice a crate going stale.
  # Monthly and grouped to keep this to roughly one matrix run a month. If a
  # bump raises the effective MSRV, the `msrv` job fails and the PR stays red —
  # that is the guard working, not a bug to route around.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
