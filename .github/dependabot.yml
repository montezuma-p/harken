version: 2

updates:
  # Actions are pinned by commit SHA in ci.yml, which is secure but freezes them
  # until something bumps them. This is that something. Dependabot reads the
  # `# v6`-style comment next to each SHA to know what version it stands for.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # One PR for all of them: a pull request builds the full 5-target release
    # matrix (pr-run-mode = "upload"), so each extra PR costs a real matrix run.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    # This ecosystem scans every file in .github/workflows and cannot be scoped
    # to one, so it also sees release.yml — which `dist generate` owns and which
    # hardcodes its own action versions. Bumping one of those there produces a
    # PR that can never merge: `dist plan` fails the drift check on every run
    # (exit 255, with the diff), and regenerating just puts dist's version back.
    #
    # So the actions dist controls are ignored here. They move when
    # `cargo-dist-version` in dist-workspace.toml moves; keep ci.yml's pins
    # aligned with whatever that dist release generates.
    ignore:
      - dependency-name: "actions/checkout"
      - dependency-name: "actions/download-artifact"
      - dependency-name: "actions/upload-artifact"
      # release.yml spells it lowercase, ci.yml uses the canonical case
      - dependency-name: "Swatinem/rust-cache"
      - dependency-name: "swatinem/rust-cache"

  # Cargo is here mostly for security freshness; `cargo audit` in the deps job
  # only reports known advisories, it does not notice a crate going stale.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    # Minor and patch only in the shared PR. Majors are deliberately left out of
    # the group so they arrive one per PR: the first grouped attempt bundled
    # ureq 2->3 and zip 2->8, and ureq 3 dropped `Response::header` and
    # `Response::into_reader` (both used in src/model.rs), which reddened the
    # whole batch and hid the safe bumps behind a migration.
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
