name: CI

# Every action is pinned to a commit SHA, not a tag: `@v6`, `@v2` and the like
# are mutable refs that the owner can move at any time. The trailing comment is
# what Dependabot reads to know which version a SHA stands for — keep it in sync
# when bumping (see .github/dependabot.yml).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "scripts/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "scripts/**"
      - "LICENSE"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      # Same version as rust-toolchain.toml — bump the two together. Pinned
      # rather than tracking stable because `clippy -D warnings` below is a
      # gate: a new Rust release shipping a new lint would turn this red with
      # no change of ours.
      #
      # Addressed as @v1 with an explicit `toolchain` rather than as
      # @1.97.1, because dtolnay ships those version refs as branches whose
      # commits are not reachable from the default branch — pinning one by SHA
      # is the "impostor commit" pattern, and Dependabot cannot track it.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Keeps `rust-version` in Cargo.toml honest — without this, the MSRV is a
  # claim nobody checks.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.88"
      # Distinct key: rust-cache derives its own from `rustc -vV`, which
      # resolves through rust-toolchain.toml to 1.97.1 — this job would
      # otherwise share the `test` job's cache while building with 1.88.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv
      # `+1.88` is load-bearing: rust-toolchain.toml pins 1.97.1 and a bare
      # `cargo check` would silently honour it, so this job would stop testing
      # the floor while still reporting green.
      - run: cargo +1.88 check --all-targets --locked

  # These two were local-only gates via `make check`. Pinned to the versions in
  # the Makefile's install-dev-tools target so a tool release cannot change the
  # verdict on its own.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.97.1"
      # Prebuilt binaries instead of `cargo install`, which would spend ~5min
      # compiling cargo-audit every run. The action verifies SHA256 and any
      # attestation the tool publishes.
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-audit@0.22.2,cargo-machete@0.9.2
      - run: cargo audit
      - run: cargo machete
