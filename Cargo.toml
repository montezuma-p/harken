[package]
name = "harken"
version = "0.4.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Local, offline audio transcription CLI (whisper.cpp) with WhatsApp chat-export support"
repository = "https://github.com/montezuma-p/harken"
homepage = "https://github.com/montezuma-p/harken"
exclude = [
    "hub/",
    ".playwright-mcp/",
    "transcripts/",
    ".claude/",
    ".claude-plugin/",
    ".github/",
    "docs/assets/",
    "scripts/",
    # Vendored whisper.cpp: the package ships only what build.rs compiles
    # (src/, include/, ggml/) plus upstream's LICENSE. The rest is dead weight
    # for `cargo install` and docs.rs, which build from the .crate alone.
    "vendor/whisper.cpp/examples/",
    "vendor/whisper.cpp/bindings/",
    "vendor/whisper.cpp/tests/",
    "vendor/whisper.cpp/models/",
    "vendor/whisper.cpp/samples/",
    "vendor/whisper.cpp/grammars/",
    "vendor/whisper.cpp/scripts/",
    "vendor/whisper.cpp/.devops/",
    "vendor/whisper.cpp/ci/",
]
readme = "README.md"
keywords = ["whisper", "transcription", "audio", "whatsapp", "speech-to-text"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
glob = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ureq = "2"
indicatif = "0.17"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4"] }
ogg = "0.9.2"
opus = "0.3.1"
rubato = "5.0.0"

[build-dependencies]
# whisper.cpp is vendored as the git submodule at vendor/whisper.cpp (pinned to v1.7.6).
cc = "1"

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
