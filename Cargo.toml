[package]
name = "harken"
version = "0.3.1"
edition = "2021"
license = "MIT"
description = "Local, offline audio transcription CLI (whisper.cpp) with WhatsApp chat-export support"
repository = "https://github.com/montezuma-p/harken"
homepage = "https://github.com/montezuma-p/harken"
exclude = ["hub/", ".playwright-mcp/", "transcripts/", ".claude/", ".claude-plugin/", ".github/", "docs/assets/", "scripts/"]
readme = "README.md"
keywords = ["whisper", "transcription", "audio", "whatsapp", "speech-to-text"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
glob = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ureq = "2"
indicatif = "0.17"
whisper-rs = "0.16.0"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4"] }
ogg = "0.9.2"
opus = "0.3.1"
rubato = "5.0.0"

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
